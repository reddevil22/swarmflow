    spec: |
      Implement the deferred "multi-tab sync" feature for the history machine
      (BroadcastChannel-based), matching the project's architecture (actor owns
      orchestration, React stays presentation).

      1) historyMachine accepts an optional channel factory in its input, e.g.
         `createChannel?: () => BroadcastChannelLike`, where BroadcastChannelLike is a
         minimal structural type (postMessage/addEventListener or onmessage/close).
         Default: use the real `globalThis.BroadcastChannel` when available; when it is
         unavailable (plain Node), behave exactly as today (no-op sync).
      2) On ADD: broadcast the added entry (include the entry payload and a `version`
         field, e.g. 1). On receiving a valid message: merge the entry into history with
         the SAME semantics as local adds (dedupe, most-recent-first). Do not
         re-broadcast received entries (no loops). Ignore malformed/unknown messages.
      3) Persistence behavior stays as-is (localStorage write-through on changes,
         restore on start). Keep the existing public API surface otherwise compatible.
      4) Tests: extend src/machines/historyMachine.test.ts with a fake channel double:
         - ADD broadcasts exactly one message with the entry + version
         - receiving a valid message merges/dedupes correctly without re-broadcast
         - most-recent-first ordering is preserved on merge
         - malformed messages are ignored
         - with no channel available the machine behaves exactly as before
         Follow the existing test style (createActor, fake timers where relevant). All
         existing machine tests and any persistence tests must stay green.

      NOTE: src/App.test.tsx may be red for the unrelated known issue under repair in a
      parallel task - ignore those 9 failures and do NOT touch them.
    acceptance:
