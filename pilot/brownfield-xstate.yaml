      The component-test layer is red: `npx vitest run src/App.test.tsx` fails 9/9 with
      `TypeError: React.act is not a function`. Machine tests (17) are green and
      typecheck is clean.

      ROOT CAUSE (found by operator recon; verify and implement the fix):
      this machine exports NODE_ENV=production to every child process. That leaks the
      "production" export condition into vite/vitest module resolution, under which
      react@19.2.8's `act` export is undefined; @testing-library/react's deprecated
      react-dom/test-utils forwarder then throws. Verified fix lever:
        set NODE_ENV=development && npm test   -> 26/26 passed (the same suite).

      REQUIRED OUTCOME: a repo-level change so that plain `npm test` is green even with
      the ambient NODE_ENV=production (callers must not need to export anything).
      - Forcing the test resolution/mode to development from vite.config.ts is the
        expected shape (the config file runs before module resolution; setting
        process.env.NODE_ENV there, or an equivalent vitest/vite option, is acceptable).
        Make it explicit and commented so future readers understand why.
      - Verify twice: `npm test` (ambient production) and
        `set NODE_ENV=development && npm test` - both must be 26/26 green.

      Style/constraints:
      - Do NOT modify anything under src/ except src/test/setup.ts (likely not needed).
      - Do NOT install or upgrade dependencies; use only what is installed.
      - Do not weaken or skip tests. Keep `npm run typecheck` and `npm run test:e2e`
        green (e2e was green before your change).

      Historical context (approaches already disproven, do not repeat): runtime patch of
      the react namespace (frozen: "Cannot redefine property: act"); test.alias to a
      shim re-exporting react/index.js (blocked by react's exports map); vi.mock('react')
      (RTL is externalized, unmocked); @testing-library/react 16.3.3 (same failure).
    acceptance:
