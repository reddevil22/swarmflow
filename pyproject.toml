[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmflow"
dynamic = ["version"]
description = "Deterministic control plane for orchestrating swarms of local coding agents on greenfield projects"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "swarmflow contributors" }]
keywords = ["agents", "orchestration", "llm", "swarm", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.2"]

[project.scripts]
swarmflow = "swarmflow.cli:main"

[project.urls]
Homepage = "https://github.com/reddevil22/swarmflow"
Repository = "https://github.com/reddevil22/swarmflow"
Issues = "https://github.com/reddevil22/swarmflow/issues"
Changelog = "https://github.com/reddevil22/swarmflow/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["swarmflow"]

[tool.setuptools.dynamic]
version = { attr = "swarmflow.__version__" }

[tool.setuptools.package-data]
swarmflow = ["assets/prompts/*.md", "assets/*.md", "assets/config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
