[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmflow"
version = "0.1.0"
description = "Deterministic control plane for orchestrating swarms of local coding agents on greenfield projects"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "swarmflow contributors" }]
keywords = ["agents", "orchestration", "llm", "swarm", "code-generation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pyyaml>=6.0", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
swarmflow = "swarmflow.cli:main"

[project.urls]
Homepage = "https://github.com/reddevil22/swarmflow"
Issues = "https://github.com/reddevil22/swarmflow/issues"

[tool.setuptools]
packages = ["swarmflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
