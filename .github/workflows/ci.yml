name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  package:
    name: wheel builds and installs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install dist/*.whl
      - name: Smoke the installed CLI outside the source tree
        working-directory: /tmp
        run: |
          /tmp/venv/bin/swarmflow --help
          SWARMFLOW_CONFIG=/tmp/cfg/swarmflow.yaml SWARMFLOW_STATE_DIR=/tmp/state \
            /tmp/venv/bin/swarmflow init
          SWARMFLOW_CONFIG=/tmp/cfg/swarmflow.yaml SWARMFLOW_STATE_DIR=/tmp/state \
            /tmp/venv/bin/swarmflow status --json
