# swarmflow configuration
frontier:
  cmd_path: "C:\\Users\\redde\\AppData\\Roaming\\npm\\cmd.cmd"
  model: "deepseek/deepseek-v4-flash"
  effort: null              # null | low | high | max (model supports high, max)
  timeout_s: 300

worker:
  node: "node"
  pi_cli: "C:\\Users\\redde\\AppData\\Roaming\\npm\\node_modules\\@earendil-works\\pi-coding-agent\\dist\\cli.js"
  model: "vllm-79/qwen36"
  thinking: "high"          # default; tasks may override
  retry_thinking: "medium"  # proven recovery for reasoning-spiral failures
  timeout_s: 2400
  max_turns: 45             # supervisor kills workers that exceed this
  max_output_tokens: 32768  # model output cap, used for spiral detection

swarm:
  concurrency: 8
  stagger_s: 2.0
  metrics_url: "http://192.168.1.79:8000/metrics"
  backpressure_waiting: 1   # hold dispatch when server has queued requests
  backpressure_kv: 0.55     # hold dispatch above this KV-cache usage

paths:
  logs_dir: "logs"
  ledger: "state/ledger.db"
