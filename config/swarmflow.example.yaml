# swarmflow configuration example
# Copy to config/swarmflow.yaml (or run `swarmflow init`) and edit for your machine.
# Values support ${ENV_VAR} expansion; local edits to config/swarmflow.yaml are
# untracked by git. An alternative config path can be given with --config or the
# SWARMFLOW_CONFIG environment variable.
# Note: model ids, thinking levels and .cmd/.bat executable paths are validated at
# load time (no shell metacharacters; cmd.exe-routed paths may not contain spaces).

frontier:
  # Backend used for planning / verification / acceptance.
  #   auto        - picks the first configured option below (command > base_url > CLI)
  #   openai      - any OpenAI-compatible /chat/completions endpoint (stdlib, no SDK)
  #   commandcode - Command Code CLI in headless mode
  #   cli         - any terminal agent CLI via an argv template
  #   pi          - Pi itself, with a provider model configured in Pi
  backend: "auto"

  # --- openai backend -------------------------------------------------------
  base_url: ""              # e.g. "https://api.deepseek.com/v1", "http://localhost:11434/v1"
  api_key: ""               # e.g. "${DEEPSEEK_API_KEY}" (env expansion supported)
  system_prompt: ""         # optional system message
  extra_body: {}            # merged into the request body, e.g. {"chat_template_kwargs": {"enable_thinking": false}}

  # --- commandcode backend --------------------------------------------------
  cmd_path: ""              # leave empty to auto-detect `commandcode` on PATH

  # --- cli backend (adapter for any CLI agent) ------------------------------
  command: []               # e.g. ["myagent", "--prompt-file", "{prompt_file}", "--json"]
                            # tokens support {prompt_file} (temp file) and {prompt} (inline)
  output: "text"            # text | json
  result_path: ""           # dotted path into JSON output, e.g. "result.finalText"

  # --- pi backend -----------------------------------------------------------
  pi_cli: ""                # leave empty to auto-detect `pi` on PATH
  node: "node"
  thinking: ""              # pi backend only; one of off|minimal|low|medium|high|xhigh|max

  # --- common ----------------------------------------------------------------
  model: "deepseek/deepseek-v4-flash"   # model id for the chosen backend
  effort: null            # commandcode backend only: null | low | high | max
  timeout_s: 300

worker:
  # Pi executable for worker sessions. Leave empty to auto-detect `pi` on PATH,
  # or point at an entry point such as
  # .../node_modules/@earendil-works/pi-coding-agent/dist/cli.js
  pi_cli: ""
  node: "node"
  # Model id exactly as configured in Pi (see ~/.pi/agent/models.json),
  # e.g. "mybox/qwen3.6-35b-a3b". Per-task thinking levels come from the plan;
  # retry_thinking is used when a worker is retried after a reasoning spiral.
  model: ""
  retry_thinking: "medium"
  timeout_s: 2400         # per-session wall clock limit (seconds)
  max_turns: 45           # supervisor kills workers above this turn count
  max_output_tokens: 32768  # model output cap, used for spiral detection
  poll_s: 15.0            # supervisor tick: every live handle is checked each tick
  kill_grace_s: 30.0      # bounded wait after a tree kill; then kill_failed is recorded

swarm:
  concurrency: 8          # measured sweet spot for one local endpoint: 8-10
  stagger_s: 2.0
  metrics_url: "http://127.0.0.1:8000/metrics"  # vLLM /metrics for admission control
  backpressure_waiting: 1 # hold dispatch when the server has queued requests
  backpressure_kv: 0.55   # hold dispatch above this KV-cache usage

paths:
  logs_dir: "logs"        # traces, relative to the target project root
  ledger: "state/ledger.db"
  state_dir: "state"      # control-plane run store (outside any target project);
                          # holds run.json + frozen.json per project - a worker cannot
                          # reach it, unlike .swarmflow/ inside the project

audit:
  # Extra ignore patterns for the greenfield (walk-based) audit. Brownfield runs
  # use git itself (.gitignore) as the source of truth instead.
  ignore_extra: []

regression:
  enabled: true           # run the project test suite at every wave boundary
  command: ""             # overrides the recon-detected regression command
  timeout_s: 900          # kill a hung/watch-mode suite instead of hanging wave-run
  shrink_tolerance: 0     # tolerated drop in executed tests before "suite shrank" fails
  strict: true            # uncomparable results (no fingerprints) fail the gate closed

discrimination:
  # After each wave, the wave's owned test files are run against the parent state
  # (the run's base commit) in a throwaway git worktree: a test that also passes there
  # pins nothing about the change. Verdicts land in the evidence bundle.
  enabled: true           # brownfield runs with a base_sha only
  mode: warn              # warn (evidence only) | enforce (non-discriminating tests fail the wave)
  link_dirs: ["node_modules"]   # directories linked into the worktree (npm layout)
  timeout_s: 900          # per test-command run inside the parent worktree
  max_test_files: 20      # cap on files checked per wave
  skip_patterns: []       # fnmatch; add browser-e2e globs when they need a live server

sweep:
  # After each wave, processes born during the wave that are attributable to the
  # project (command line or working directory) are reported as evidence; leaked
  # servers otherwise keep ports and poison later probes with stale code.
  enabled: true
  mode: warn              # warn (report) | kill (terminate this wave's new processes)
  kill_requires_port: true  # kill only port-holding or allowlisted server processes
  ignore_ports: [8000]    # e.g. a local model / metrics endpoint
  ignore_names: []        # extra process names to never report or kill
  server_names: ["node", "vite", "ts-node", "npm", "npx", "webpack", "next"]

verify:
  # Frontier verification (prompts/verifier.md) of a wave's delivered tasks, run after
  # the gates. Off by default so frontier spend is explicit; `wave-run --verify` forces
  # it for one wave. Verdicts move tasks to verified / needs_fix.
  enabled: false
  max_tasks: 5            # cap per wave; the rest are reported as skipped

git:
  branch_prefix: "swarmflow/"   # brownfield run branches are <prefix><project_name>
